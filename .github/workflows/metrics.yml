name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"  # ogni giorno a mezzanotte
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/metrics.yml'

# Every step below pins repositories_batch. The default (100) makes the action
# ask GitHub for 100 repositories in a single GraphQL query, each with ~10
# sub-connections (releases, deployments, environments, languages, open/closed
# issues, open/closed/merged PRs). That query now exceeds GitHub's time budget
# for this account and returns 502 / "we couldn't respond in time".
#
# The action does not recover from that: its retry path halves the batch and
# `continue`s, but `continue` in a do...while jumps to the condition, which
# tests a counter still at 0 on the first page — so a first-page failure exits
# the loop with zero repositories and the run still reports success. Every
# repository-derived figure then renders as 0 (releases, stargazers, forkers,
# watchers, licenses, languages) with nothing in the log to say so.
#
# Measured against this account: first:100 fails every time, first:74 fails
# half the time, first:60 and first:50 succeeded 10/10. 60 is the largest size
# with a reliable margin. Note the query cost is fixed at the batch size, so
# this does not get riskier as the account gains repositories.
#
# The same bug caps the fetch at one page (it breaks whenever a page is
# smaller than the total limit), so these figures cover the 60 most recently
# updated non-fork repositories rather than all of them — a lower bound.
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Stats generali
      - name: Generate base metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/github-stats.svg
          user: AndreaBozzo
          repositories_batch: 60
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: Europe/Rome
          config_display: large

      # Linguaggi
      - name: Generate languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          user: AndreaBozzo
          repositories_batch: 60
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          config_timezone: Europe/Rome

      # Contribution Graph
      - name: Generate contribution graph
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/contributions.svg
          user: AndreaBozzo
          repositories_batch: 60
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Rome
