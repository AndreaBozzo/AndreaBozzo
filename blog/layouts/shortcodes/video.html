{{- $src := .Get "src" | relURL -}}
{{- $poster := .Get "poster" -}}
<figure class="post-video">
  <video controls muted playsinline preload="metadata" width="100%"{{ with $poster }} poster="{{ . | relURL }}"{{ end }}>
    <source src="{{ $src }}" type="video/mp4">
    <a href="{{ $src }}">{{ .Get "fallback" | default "Download the video" }}</a>
  </video>
  {{- with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
